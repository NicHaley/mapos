appId: md.mapos.app
productName: MapOS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Bundled separately via extraResources (served over mapos-asset://); keep out of the asar.
  - '!resources/basemap-assets/**'
asarUnpack:
  - resources/**
# Global basemap glyphs/sprites copied to <app>/Resources/basemap-assets (process.resourcesPath).
extraResources:
  - from: resources/basemap-assets
    to: basemap-assets
win:
  executableName: MapOS
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "Nicholas Haley (45N226Q5J8)"
  notarize: true
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  # Cloudflare R2 public bucket bound to updates.mapos.md.
  # Upload latest-mac.yml + the artefacts produced by electron-builder to the bucket root
  # after each `pnpm --filter @mapos/dashboard build:mac`.
  url: https://updates.mapos.md
  channel: latest

