packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@biomejs/biome': true
  '@google/genai': true
  # built for Electron's ABI by the dashboard's electron-rebuild postinstall,
  # not by pnpm — its own prebuild-install would fetch a system-Node binary (wrong ABI)
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
